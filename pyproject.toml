[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "results-tracker"
version = "1.1.0"
description = "Track paper results: method comparisons, parameter sweeps, ablation studies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Haley Duba-Sullivan", email = "hduba@purdue.edu" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",  # db.py and models.py import it directly, not only through sqlmodel
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
# `dev` pulls in the optional stacks so `pip install -e ".[dev]"` can run the whole suite:
# the tests import numpy, matplotlib and streamlit.
dev = ["pytest>=8", "results-tracker[ui,export]"]
export = ["matplotlib>=3.8", "numpy>=1.24"]
ui = ["streamlit>=1.35", "plotly>=5", "pandas>=2", "matplotlib>=3.8", "numpy>=1.24"]

[project.scripts]
results-tracker = "results_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/results_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
