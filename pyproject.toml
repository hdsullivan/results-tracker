[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "results-tracker"
version = "1.0.0"
description = "Track paper results: method comparisons, parameter sweeps, ablation studies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["matplotlib>=3.8"]
ui = ["streamlit>=1.35", "plotly>=5", "pandas>=2", "matplotlib>=3.8"]

[project.scripts]
results-tracker = "results_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/results_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
